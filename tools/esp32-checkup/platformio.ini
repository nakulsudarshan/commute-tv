; Standalone diagnostic sketch. Not the real firmware -- it exists to answer
; three questions before we build anything:
;   1. what is the ESP32's station MAC (needed for dorm registration)
;   2. does the board work and how much heap is actually free
;   3. what 2.4 GHz networks can it see, and how strong is your hotspot
;
;   cd tools/esp32-checkup
;   pio run -t upload -t monitor

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework  = arduino
monitor_speed = 115200
; Most ESP32-D boards use a CH340 or CP2102 bridge; PlatformIO picks the port
; automatically. Uncomment and set explicitly if it guesses wrong.
; upload_port = /dev/ttyUSB0
; monitor_port = /dev/ttyUSB0
