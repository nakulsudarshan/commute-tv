; commute-tv firmware -- the ESP32 that does the thinking.
;
; The shared C++ under ../src is compiled straight into this project rather than
; being copied or vendored. That is deliberate: `make test` on the laptop and
; this build compile the SAME files, so a test that passes is a statement about
; the firmware and not about a snapshot of it.
;
;   pio run                 build
;   pio run -t upload       flash
;   pio device monitor      serial, 115200
;
; ⚠️ NEVER call esp_wifi_set_mac(), and do not add a library that does. The
; MAC is eFuse-burned and is what the dorm network has registered.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; The default table gives 1.25 MB to the app, and the bring-up firmware was
; already at 70% of it BEFORE mbedTLS came in with the HTTPS clients. min_spiffs
; gives 1.9 MB per app slot and KEEPS TWO OTA SLOTS, which huge_app.csv does not
; -- OTA is on the roadmap and a partition table is an awkward thing to change
; once the device is on a shelf.
board_build.partitions = min_spiffs.csv

; -Wconversion is deliberately NOT here. The Arduino and ESP-IDF headers do not
; survive it, and turning it off globally would also lose it on our own code --
; which is where it earns its place. Our code is already compiled with the full
; warning set by `make test` on the host; this build is for the platform glue.
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -I include
    -I ../src

build_unflags = -std=gnu++11

; Pull the shared modules in by path. Only what this firmware actually uses --
; the JPEG encoder and the 240x240 renderer arrive with the SmallTV client, not
; with a first bring-up that has to prove the OLED and the radio.
build_src_filter =
    +<*>
    ; Compiled by `make firmware` (the laptop syntax gate) so that
    ; platform/net_client.h is parsed there, not only by this two-minute build.
    ; It is not part of the image and would drag mbedTLS into flash early.
    -<net_client_probe.cpp>
    +<../../src/core/*.cpp>
    +<../../src/oled/*.cpp>
    +<../../src/net/*.cpp>
    +<../../src/json/*.cpp>
    +<../../src/google/*.cpp>
    +<../../src/hafas/*.cpp>
    +<../../src/ors/*.cpp>
    +<../../src/weather/*.cpp>
    +<../../src/render/*.cpp>
    +<../../src/jpeg/*.cpp>
    +<../../src/smalltv/*.cpp>
    +<../../src/app/*.cpp>
